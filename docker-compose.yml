# Single-origin stack: postgres + migrations + ONE app container (the API
# serves the web app). Local/VPS:
#   JWT_SECRET=$(openssl rand -hex 32) docker compose up -d --build
#   -> http://localhost:3000 (or the VPS IP) is the entire platform.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/bootstrap.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "db-dist/migrate.js"]
    environment:
      ADMIN_DB_URL: postgres://jenga_migrator:migrator_dev_pw@postgres:5432/jenga_dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_DB_URL: postgres://jenga_app:app_dev_pw@postgres:5432/jenga_dev
      WORKER_DB_URL: postgres://jenga_worker:worker_dev_pw@postgres:5432/jenga_dev
      ADMIN_DB_URL: postgres://jenga_migrator:migrator_dev_pw@postgres:5432/jenga_dev
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -hex 32)}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-${JWT_SECRET}}
      FISCAL_WORKER_ENABLED: "true"
      NOTIFY_WORKER_ENABLED: "true"
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
