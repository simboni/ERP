# Render Blueprint — SINGLE SERVICE, single origin (docs/deploy-render.md).
# One container serves the API and the web app together: no service
# discovery, no CORS, no cross-service env plumbing — nothing to race.
# The pre-deploy step provisions DB roles + runs migrations; every guard
# degrades gracefully and reports via /health instead of failing a deploy.

databases:
  - name: jenga-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: jenga-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    preDeployCommand: node db-dist/bootstrap-and-migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: APP_DB_PASSWORD
        generateValue: true
      - key: WORKER_DB_PASSWORD
        generateValue: true
      - key: ADMIN_DB_URL
        fromDatabase:
          name: jenga-db
          property: connectionString
      - key: FISCAL_WORKER_ENABLED
        value: "true"
      - key: NOTIFY_WORKER_ENABLED
        value: "true"
