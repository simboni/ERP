# Render Blueprint — ZERO-TOUCH deploy (docs/deploy-render.md).
# The API's pre-deploy step provisions its own runtime DB roles (passwords
# auto-generated below) and runs migrations; connection URLs and CORS/API
# hosts are derived automatically. Click "Apply" and wait for green.

databases:
  - name: jenga-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: jenga-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    preDeployCommand: node db-dist/bootstrap-and-migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: APP_DB_PASSWORD
        generateValue: true
      - key: WORKER_DB_PASSWORD
        generateValue: true
      - key: ADMIN_DB_URL
        fromDatabase:
          name: jenga-db
          property: connectionString
      - key: WEB_ORIGIN_HOST
        fromService:
          type: web
          name: jenga-web
          property: host
      - key: FISCAL_WORKER_ENABLED
        value: "true"
      - key: NOTIFY_WORKER_ENABLED
        value: "true"

  - type: web
    name: jenga-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NEXT_OUTPUT
        value: standalone
      - key: API_HOST
        fromService:
          type: web
          name: jenga-api
          property: host
