name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap database roles
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/bootstrap.sql

      - name: Run migrations (test database)
        run: pnpm db:migrate:test

      - name: Build
        run: pnpm build

      - name: Test (includes RLS cross-tenant leak gate)
        run: pnpm test
